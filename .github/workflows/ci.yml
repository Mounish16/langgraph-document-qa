name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install system libraries for PDF export
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test (fake models, no Ollama needed)
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t langgraph-document-qa .
