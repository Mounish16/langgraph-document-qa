<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LangGraph Document Q&amp;A</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
  :root {
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --line:#2a3650;
    --text:#e6ebf5; --muted:#8b97b0; --accent:#5b8cff; --ok:#34d399; --err:#f87171;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .ollama { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--err); }
  textarea { width:100%; min-height:90px; resize:vertical; background:var(--panel2);
    border:1px solid var(--line); border-radius:12px; color:var(--text);
    padding:14px 16px; font-size:15px; font-family:inherit; }
  textarea:focus { outline:none; border-color:var(--accent); }
  .actions { display:flex; align-items:center; gap:14px; margin-top:16px; }
  button.run { background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:12px 22px; font-size:15px; font-weight:600; cursor:pointer; }
  button.run:disabled { opacity:.5; cursor:not-allowed; }
  .status { color:var(--muted); font-size:13px; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--line);
    border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #result { margin-top:30px; display:none; }
  .downloads { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .dl { font-size:13px; font-weight:600; padding:9px 16px; border-radius:10px; text-decoration:none;
    background:rgba(52,211,153,.12); border:1px solid rgba(52,211,153,.4); color:#a7f3d0; }
  .dl.secondary { background:var(--panel2); border-color:var(--line); color:var(--muted); }
  .answer { background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:22px 26px; font-size:15px; overflow-x:auto; }
  .answer h1 { font-size:20px; margin:.2em 0 .5em; }
  .answer h2 { font-size:17px; margin:1.2em 0 .4em; border-bottom:1px solid var(--line); padding-bottom:4px; }
  .answer h3 { font-size:15px; margin:1em 0 .3em; }
  .answer table { border-collapse:collapse; width:100%; margin:.6em 0; font-size:13.5px; }
  .answer th, .answer td { border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top; }
  .answer th { background:var(--panel2); }
  .answer code { background:#0b1018; padding:1px 5px; border-radius:4px; font-size:13px; }
  .answer pre { background:#0b1018; border:1px solid var(--line); border-radius:8px; padding:14px; overflow:auto; }
  .err { color:var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <h1>LangGraph Document Q&amp;A</h1>
  <div id="ollama" class="ollama">checking model…</div>

  <textarea id="q" placeholder="Ask a question…"></textarea>
  <div class="actions">
    <button id="run" class="run" onclick="ask()">Ask</button>
    <span id="status" class="status"></span>
  </div>

  <section id="result">
    <div class="downloads" id="downloads"></div>
    <div class="answer" id="answer"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function loadStatus(){
  try {
    const s = await (await fetch('/api/status')).json();
    const on = s.ollama_up;
    $('ollama').innerHTML = `<span class="dot ${on?'on':'off'}"></span>` +
      (on ? `model ${s.llm_model} ready` : `model not reachable at ${s.ollama_url} — start Ollama first`);
  } catch(e){ $('ollama').innerHTML = `<span class="dot off"></span>API not reachable`; }
}

function renderDownloads(files){
  const el = $('downloads');
  el.innerHTML = '';
  if(!files) return;
  // priority order: PDF, DOCX, then MD as fallback
  const order = [['pdf','Download PDF',''], ['docx','Download DOCX',''], ['md','Download .md','secondary']];
  for(const [fmt, label, cls] of order){
    if(!files[fmt]) continue;
    const a = document.createElement('a');
    a.className = 'dl ' + cls;
    a.href = '/api/download/' + encodeURIComponent(files[fmt]);
    a.setAttribute('download', files[fmt]);
    a.textContent = label;
    el.appendChild(a);
  }
}

function renderAnswer(text){
  const el = $('answer');
  if(window.marked){ el.innerHTML = marked.parse(text || ''); }
  else { el.textContent = text || ''; }
}

async function ask(){
  const question = $('q').value.trim();
  if(!question){ $('status').textContent = 'Type a question first.'; return; }
  $('run').disabled = true;
  $('result').style.display = 'none';
  $('status').innerHTML = `<span class="spinner"></span> Working… the first ask also builds the FAISS indexes.`;
  try {
    const d = await fetch('/api/ask', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ question })
    }).then(async r => { const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.detail||r.statusText); return j; });

    renderDownloads(d.files);
    renderAnswer(d.answer);
    $('result').style.display = 'block';
    $('status').textContent = 'Done.';
  } catch(e){
    $('status').innerHTML = `<span class="err">Failed: ${e.message}</span>`;
  } finally {
    $('run').disabled = false;
  }
}

$('q').addEventListener('keydown', (e)=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter') ask(); });
loadStatus();
</script>
</body>
</html>
